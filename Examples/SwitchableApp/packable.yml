# Which dependencies SwitchableApp builds from source and which it links as XCFrameworks.
# Switch with:  xcframework-packable use source|binary ShowcaseKit
dependencies:
  ShowcaseKit:
    mode: source
    source: { path: ../ShowcaseKit }
    # No `binary:` location, so binary mode packages ShowcaseKit itself and caches the
    # result; it's rebuilt only when ShowcaseKit's files change.
    platforms: [macos, ios, ios-simulator]
